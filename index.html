<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120f24" />
    <meta name="description" content="Vibe Coding Dev Story. Run a startup where the AI writes the code and Reddit reads the reviews out loud." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vibe Dev Story" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Vibe Coding Dev Story" />
    <meta property="og:description" content="A startup sim where the AI writes the code and Reddit reads the reviews out loud. Ship an app. Read the thread. Survive the weekend." />
    <meta property="og:image" content="./icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Vibe Coding Dev Story</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #120f24; overflow: hidden; overscroll-behavior: contain; }
      body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffd2a8; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; transition: opacity 0.25s; }
      #boot.done { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="boot"><span id="boot-line">booting vibes...</span></div>
    <div id="game"></div>
    <script>
      // the page is a blank screen for a second while the fonts bake: give it a joke or two
      (function () {
        var lines = ['booting vibes...', 'asking the AI to write the game...', 'accepting all changes...', 'npm install (2,314 packages)...', 'deleting the failing tests...', 'you are absolutely right...', 'hallucinating a loading bar...', 'warming up the tokens...'];
        var el = document.getElementById('boot-line');
        var boot = document.getElementById('boot');
        var i = 0;
        var timer = setInterval(function () {
          if (!el || !boot || boot.classList.contains('done')) return clearInterval(timer);
          i = (i + 1) % lines.length;
          el.textContent = lines[i];
        }, 700);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
